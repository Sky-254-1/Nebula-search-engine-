[pytest]
asyncio_mode = auto
testpaths = ../tests tests
pythonpath = .
addopts = --ignore=../tests/e2e --ignore=../tests/load
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
source = app
omit =
    app/__init__.py
    app/providers/ai/gguf.py

[coverage:report]
fail_under = 85
show_missing = true
