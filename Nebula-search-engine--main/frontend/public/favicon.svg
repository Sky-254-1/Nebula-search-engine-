  <path d="M32 32 L32 16" stroke="url(#logoGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 32 L48 24" stroke="url(#logoGradient)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
