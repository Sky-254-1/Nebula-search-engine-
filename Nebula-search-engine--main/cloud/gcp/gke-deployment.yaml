# GCP GKE Deployment Configuration for Nebula Search

# 1. Create GKE Cluster
# gcloud container clusters create nebula-search \
#   --zone us-central1-a \
#   --num-nodes 3 \
#   --min-nodes 2 \
#   --max-nodes 10 \
#   --machine-type e2-standard-4 \
#   --enable-ip-alias \
#   --enable-autoscaling

# 2. Install Cloud SQL Proxy for PostgreSQL
# kubectl apply -f https://github.com/GoogleCloudPlatform/cloudsql-proxy/releases/latest/download/cloudsql-proxy.yaml

# 3. Install Prometheus Operator
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm install prometheus prometheus-community/kube-prometheus-stack

# 4. Apply Kubernetes manifests from kubernetes/ directory
# kubectl apply -f kubernetes/configs/
# kubectl apply -f kubernetes/deployments/
# kubectl apply -f kubernetes/services/

---
# GKE-specific Ingress for load balancing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nebula-ingress
  labels:
    app: nebula
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: nebula-static-ip
    networking.gke.io/managed-certificates: nebula-certificate
    networking.gke.io/v1beta1.FrontendConfig: nebula-frontend-config
spec:
  rules:
  - host: nebula-search.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nebula-nginx
            port:
              number: 443
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nebula-nginx
            port:
              number: 443

---
# GCP Managed Certificate
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: nebula-certificate
spec:
  domains:
  - nebula-search.example.com

---
# GCP Frontend Configuration for SSL
apiVersion: networking.gke.io/v1beta1
kind: FrontendConfig
metadata:
  name: nebula-frontend-config
spec:
  sslPolicy: nebula-ssl-policy
  redirectToHttps:
    enabled: true
    responseCodeName: MOVED_PERMANENTLY_DEFAULT

---
# GCP SSL Policy
apiVersion: networking.gke.io/v1beta1
kind: SslPolicy
metadata:
  name: nebula-ssl-policy
spec:
  minTlsVersion: TLS_1_2
  profile: MODERN

---
# GCP Cloud Storage Provisioner for persistent volumes
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nebula-storage
  labels:
    app: nebula
provisioner: pd.csi.storage.gke.io
parameters:
  type: pd-ssd
  replication-type: none
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowedTopologies:
- matchLabelExpressions:
  - key: topology.gke.io/zone
    values:
    - us-central1-a
    - us-central1-b
    - us-central1-c

---
# GCP Cloud Logging Agent (DaemonSet for log collection)
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nebula-cloud-logging
  labels:
    app: nebula
    component: logging
spec:
  selector:
    matchLabels:
      app: nebula
      component: logging
  template:
    metadata:
      labels:
        app: nebula
        component: logging
    spec:
      containers:
      - name: cloud-logging-agent
        image: gcr.io/cloud-logging-agent/fluentd:latest
        env:
        - name: FLUENT_UID
          value: "0"
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        securityContext:
          runAsUser: 0
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
