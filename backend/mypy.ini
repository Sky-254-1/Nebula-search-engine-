# mypy configuration — strict where practical, quiet on optional deps
[mypy]
python_version = 3.12
warn_unused_ignores = True
namespace_packages = True
show_error_codes = True

# Optional/unused dependencies in local dev — stubs not installed by default.
# These are genuinely optional backends; missing-import noise is suppressed.
[mypy-qdrant.*]
ignore_missing_imports = True

[mypy-pymilvus.*]
ignore_missing_imports = True

[mypy-elasticsearch.*]
ignore_missing_imports = True

[mypy-faiss.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-nltk.*]
ignore_missing_imports = True

[mypy-aiofiles.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True

[mypy-llama_cpp.*]
ignore_missing_imports = True

[mypy-enchant.*]
ignore_missing_imports = True

# Additional libs without installed stubs in local dev
[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-numpy.*]
ignore_missing_imports = True

# Genuinely optional vector backends — silence all type noise in their modules.
[mypy-app.search.semantic.vector_store.qdrant_store.*]
ignore_errors = True

[mypy-app.search.semantic.vector_store.milvus_store.*]
ignore_errors = True

[mypy-app.search.semantic.vector_store.elasticsearch_store.*]
ignore_errors = True

[mypy-app.search.semantic.vector_store.pgvector_store.*]
ignore_errors = True

[mypy-vector.faiss_index]
ignore_errors = True

[mypy-vector.semantic]
ignore_errors = True

[mypy-app.services.audio]
ignore_errors = True

[mypy-app.services.spell_service]
ignore_errors = True

# Additional noisy untyped modules reported by mypy
[mypy-app.search.quality_metrics]
ignore_errors = True

[mypy-app.crawler.crawler]
ignore_errors = True

[mypy-app.crawler.scheduler]
ignore_errors = True

[mypy-app.search.intelligence]
ignore_errors = True

[mypy-app.incremental.scanner]
ignore_errors = True

[mypy-app.incremental.services]
ignore_errors = True

[mypy-app.services.background_tasks]
ignore_errors = True

[mypy-app.services.monitoring]
ignore_errors = True

[mypy-app.services.queue]
ignore_errors = True

[mypy-app.services.cache]
ignore_errors = True

[mypy-app.indexing.queue]
ignore_errors = True

[mypy-app.indexing.scheduler]
ignore_errors = True

[mypy-app.indexing.worker]
ignore_errors = True

[mypy-app.indexing.tasks]
ignore_errors = True

[mypy-app.indexing.services]
ignore_errors = True

[mypy-app.indexing.deadletter]
ignore_errors = True

[mypy-app.providers.ai.gguf]
ignore_errors = True

[mypy-app.health_routes]
ignore_errors = True
