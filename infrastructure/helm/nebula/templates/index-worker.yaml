apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebula.fullname" . }}-index-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nebula-index-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: index-worker
    app.kubernetes.io/part-of: nebula
spec:
  replicas: {{ .Values.indexWorker.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nebula-index-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nebula-index-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: index-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: index-worker
          image: "{{ .Values.indexWorker.image.repository }}:{{ .Values.indexWorker.image.tag }}"
          imagePullPolicy: {{ .Values.indexWorker.image.pullPolicy }}
          ports:
            - containerPort: 8002
              name: http
          env:
            - name: APP_ENV
              value: {{ .Values.indexWorker.env.APP_ENV | default "production" }}
            - name: LOG_LEVEL
              value: {{ .Values.indexWorker.env.LOG_LEVEL | default "INFO" }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecret }}
                  key: redis-url
          resources:
            {{- toYaml .Values.indexWorker.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebula.fullname" . }}-index-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nebula-index-worker
    app.kubernetes.io/part-of: nebula
spec:
  type: {{ .Values.indexWorker.service.type }}
  ports:
    - port: {{ .Values.indexWorker.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nebula-index-worker