apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebula.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nebula-frontend
    app.kubernetes.io/part-of: nebula
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nebula-frontend