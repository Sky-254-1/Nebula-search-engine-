# PersistentVolumeClaims for Nebula Search Engine

# Backend PVC
{{- if and .Values.backend.storage.size .Values.backend.storage.enabled (not .Values.backend.storage.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nebula.fullname" . }}-backend-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nebula-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend-storage
    app.kubernetes.io/part-of: nebula
spec:
  accessModes:
    {{- toYaml .Values.backend.storage.accessModes | nindent 4 }}
  storageClassName: {{ .Values.backend.storage.storageClass | default "standard" }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
{{- end }}

