apiVersion: v1
kind: Service
metadata:
  name: {{ include "nebula.fullname" . }}-vector-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nebula-vector-worker
    app.kubernetes.io/part-of: nebula
spec:
  type: {{ .Values.vectorWorker.service.type }}
  ports:
    - port: {{ .Values.vectorWorker.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: nebula-vector-worker