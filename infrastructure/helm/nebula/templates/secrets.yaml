{{- if .Values.secrets.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nebula.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: nebula
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: secrets
    app.kubernetes.io/part-of: nebula
type: Opaque
data:
  {{- if .Values.postgresql.auth.password }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
  {{- else }}
  postgres-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.postgresql.auth.username }}
  postgres-username: {{ .Values.postgresql.auth.username | b64enc | quote }}
  {{- else }}
  postgres-username: {{ "nebula" | b64enc | quote }}
  {{- end }}
  {{- if .Values.redis.auth.password }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  {{- else }}
  redis-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.frontend.env.API_SECRET_KEY }}
  api-secret-key: {{ .Values.frontend.env.API_SECRET_KEY | b64enc | quote }}
  {{- else }}
  api-secret-key: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.backend.env.JWT_SECRET }}
  jwt-secret: {{ .Values.backend.env.JWT_SECRET | b64enc | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- if .Values.backend.env.ENCRYPTION_KEY }}
  encryption-key: {{ .Values.backend.env.ENCRYPTION_KEY | b64enc | quote }}
  {{- else }}
  encryption-key: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.backup.s3.accessKey }}
  s3-access-key: {{ .Values.backup.s3.accessKey | b64enc | quote }}
  {{- else }}
  s3-access-key: {{ randAlphaNum 20 | b64enc | quote }}
  {{- end }}
  {{- if .Values.backup.s3.secretKey }}
  s3-secret-key: {{ .Values.backup.s3.secretKey | b64enc | quote }}
  {{- else }}
  s3-secret-key: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
{{- end }}